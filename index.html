<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>RangeFill</title>
</head>
<body>
  <main class="app">
    <header><span class="brand">RangeFill</span></header>
    <h1>얼마나 넣을까요?</h1>
    <label class="label" for="remaining">현재 남은 주행가능거리</label>
    <div class="entry"><input id="remaining" type="text" inputmode="decimal" placeholder="150" autocomplete="off" aria-describedby="remaining-hint error"><span class="unit">km</span></div>
    <p class="hint" id="remaining-hint">차량 계기판에 표시된 거리를 입력하세요.</p>
    <p id="error" role="alert"></p>
    <section class="result" aria-label="주유 계산 결과" aria-live="polite" aria-atomic="true">
      <div class="amount"><span id="cost">—</span><span class="won" id="currency"></span></div>
      <p class="liters">필요 주유량 <strong id="liters">—</strong></p>
    </section>
    <div class="gauge" id="gauge" aria-hidden="true">
      <div class="tank"><div class="have" id="fill"></div></div>
      <div class="scale">
        <span class="have-label">남은 거리 <b id="from">—</b></span>
        <span class="need-label">채울 거리 <b id="to">—</b></span>
      </div>
    </div>
    <details id="settings">
      <summary>계산 기준 설정<svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <p class="settings-note">최대 거리와 연비는 차량에 맞게 설정하세요. 주유단가는 방문할 주유소의 가격으로 바꿔주세요.</p>
      <form id="settings-form" novalidate>
        <div class="row"><label class="label" for="maximum">최대 주유 시 주행가능거리</label><div class="entry"><input id="maximum" type="text" inputmode="decimal" placeholder="600" autocomplete="off"><span class="unit">km</span></div></div>
        <div class="row"><label class="label" for="efficiency">연비</label><div class="entry"><input id="efficiency" type="text" inputmode="decimal" placeholder="15" autocomplete="off"><span class="unit">km/L</span></div></div>
        <div class="row"><label class="label" for="price">주유단가</label><div class="entry"><input id="price" type="text" inputmode="decimal" placeholder="1700" autocomplete="off"><span class="unit">원/L</span></div></div>
        <button type="submit" class="save" id="save" disabled>설정 저장</button>
        <p id="message" role="status"></p>
      </form>
    </details>
    <footer>
      <p>설정 기준: <span id="basis">저장된 설정 없음</span></p>
      <p>연비와 주행 환경에 따라 실제 주유금액은 달라질 수 있어요.</p>
      <p>설정은 ‘설정 저장’을 눌렀을 때만 이 기기에 저장돼요.</p>
    </footer>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
